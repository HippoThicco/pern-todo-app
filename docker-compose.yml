version: '3.8'

services:
  db:
    image: postgres:15
    container_name: pern-db
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: pern-server
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db

  client:
    build: ./client
    container_name: pern-client
    ports:
      - '3000:80'
    depends_on:
      - server

volumes:
  pgdata:
